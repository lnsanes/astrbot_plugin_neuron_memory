    <script type="module" src="./app.js"></script>
  <script>
(function(){
  var loaded = false;
  function el(id){ return document.getElementById(id); }
  function wcolor(w){ if (w >= 0.5) return "#78a94b"; if (w >= 0.2) return "#c58c2a"; return "#74868a"; }
  function bridge(){ return window.AstrBotPluginPage || null; }
  async function nmLoad(){
    var b = bridge();
    if (!b) { el("nm-stats").textContent = "缺少 bridge"; return; }
    var kw = (el("nm-search").value || "").trim();
    el("nm-stats").textContent = "加载中…";
    try {
      var r = await b.apiGet("page/memories", { page: 1, page_size: 120, keyword: kw });
      var d = (r && r.data) ? r.data : r;
      var items = d.items || [];
      el("nm-stats").textContent = (d.total || items.length) + " 条" + (kw ? "（匹配 " + items.length + "）" : "");
      var box = el("nm-list"); box.innerHTML = "";
      items.forEach(function(it){
        var row = document.createElement("div");
        row.style.cssText = "padding:9px 12px;border-bottom:1px solid #16181d;cursor:pointer";
        row.onmouseenter = function(){ row.style.background = "#12141a"; };
        row.onmouseleave = function(){ row.style.background = ""; };
        var head = document.createElement("div");
        head.style.cssText = "display:flex;align-items:center;gap:8px;font-size:11px;color:#6d7382;margin-bottom:3px";
        head.innerHTML = '<span style="color:' + wcolor(it.weight) + ';font-weight:600">' + it.weight.toFixed(2) + '</span>'
          + '<span>重要 ' + it.importance.toFixed(2) + '</span>'
          + '<span>' + it.created_at + '</span>'
          + '<span style="color:#4b515f">' + (it.tags || it.source || "") + '</span>';
        var body = document.createElement("div");
        body.style.cssText = "font-size:12.5px;color:#ccd2db;white-space:pre-wrap;word-break:break-word";
        body.textContent = it.text || it.summary || "";
        row.appendChild(head); row.appendChild(body);
        if (it.entities && it.entities.length) {
          var ents = document.createElement("div");
          ents.style.cssText = "font-size:11px;color:#5d6473;margin-top:3px";
          ents.textContent = "实体：" + it.entities.join(" / ");
          row.appendChild(ents);
        }
        row.onclick = function(){
          var d2 = document.createElement("div");
          d2.style.cssText = "padding:8px 12px;background:#161d2b;border-left:2px solid #78a94b;font-size:11.5px;color:#9aa3b2";
          d2.textContent = "权重 " + it.weight.toFixed(3) + " · 重要 " + it.importance.toFixed(3) + " · 访问 " + (it.access_count||0) + " 次 · 半衰期 " + (3 + 30*it.importance).toFixed(0) + " 天";
          if (row.nextSibling && row.nextSibling.dataset && row.nextSibling.dataset.nmdetail) { row.nextSibling.remove(); return; }
          d2.dataset.nmdetail = "1";
          row.parentNode.insertBefore(d2, row.nextSibling);
        };
        box.appendChild(row);
      });
      loaded = true;
    } catch (e) {
      el("nm-stats").textContent = "加载失败：" + (e && e.message ? e.message : e);
    }
  }
  function hook(){
    var btn = el("nm-refresh"); if (btn) btn.onclick = nmLoad;
    var inp = el("nm-search");
    if (inp) { var t = null; inp.oninput = function(){ clearTimeout(t); t = setTimeout(nmLoad, 300); }; }
    var nav = document.querySelector('[data-page="memlist"]');
    if (nav) nav.addEventListener("click", function(){ setTimeout(function(){ if(!loaded) nmLoad(); }, 120); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", hook);
  else hook();
})();
</script>
